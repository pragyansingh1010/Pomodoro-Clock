<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Clock</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(90deg, #eaa267, #f0c283);
        }

        .container {
            width: 220px;
            height: 460px;
            background: rgba(55, 43, 34, 0.94);
            color: white;
            text-align: center;
        }

        /* Upper part */
        .timer-section {
            height: 190px;
            background: #eee;
            margin: 0 25px;
            border-right: 12px solid #00a5b5;
            border-bottom: 12px solid #00a5b5;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #timer {
            font-size: 32px;
            color: #00a5b5;
            font-family: monospace;
        }

        /* Bottom part */
        .control-section {
            padding: 22px 12px 0;
        }

        #title {
            font-size: 26px;
            margin: 5px 0 22px;
        }

        .settings {
            border-top: 1px dotted #aaa;
            border-bottom: 1px dotted #aaa;
            padding: 20px 0;
            display: flex;
            justify-content: space-around;
        }

        .setting {
            width: 85px;
        }

        .setting-title {
            font-size: 11px;
            margin-bottom: 5px;
        }

        .value {
            font-size: 19px;
            margin-bottom: 10px;
        }

        #sessionValue {
            color: #00a5b5;
        }

        #breakValue {
            color: #e86645;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        button {
            border: none;
            background: #171310;
            color: white;
            cursor: pointer;
            border-radius: 4px;
        }

        .small-btn {
            width: 35px;
            height: 22px;
            font-size: 17px;
            line-height: 20px;
        }

        button:hover {
            background: #29221e;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .main-buttons {
            margin-top: 22px;
            display: flex;
            justify-content: space-around;
        }

        .main-btn {
            width: 78px;
            height: 45px;
            font-size: 16px;
        }

        #startBtn {
            background: #171310;
        }

        #resetBtn {
            background: #171310;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="timer-section">
            <div id="timer">20:00</div>
        </div>

        <div class="control-section">

            <div id="title">Session</div>

            <div class="settings">

                <div class="setting">
                    <div class="setting-title">session time</div>
                    <div class="value" id="sessionValue">20 min</div>

                    <div class="buttons">
                        <button class="small-btn" id="sessionMinus">-</button>
                        <button class="small-btn" id="sessionPlus">+</button>
                    </div>
                </div>

                <div class="setting">
                    <div class="setting-title">break time</div>
                    <div class="value" id="breakValue">5 min</div>

                    <div class="buttons">
                        <button class="small-btn" id="breakMinus">-</button>
                        <button class="small-btn" id="breakPlus">+</button>
                    </div>
                </div>

            </div>

            <div class="main-buttons">
                <button class="main-btn" id="startBtn">Start</button>
                <button class="main-btn" id="resetBtn">Reset</button>
            </div>

        </div>
    </div>

    <script>
        let sessionTime = 20;
        let breakTime = 5;

        let currentTime = sessionTime * 60;
        let running = false;
        let isSession = true;
        let interval;

        const timer = document.getElementById("timer");
        const title = document.getElementById("title");

        const sessionValue = document.getElementById("sessionValue");
        const breakValue = document.getElementById("breakValue");

        const sessionMinus = document.getElementById("sessionMinus");
        const sessionPlus = document.getElementById("sessionPlus");

        const breakMinus = document.getElementById("breakMinus");
        const breakPlus = document.getElementById("breakPlus");

        const startBtn = document.getElementById("startBtn");
        const resetBtn = document.getElementById("resetBtn");


        function showTime() {
            let minutes = Math.floor(currentTime / 60);
            let seconds = currentTime % 60;

            minutes = String(minutes).padStart(2, "0");
            seconds = String(seconds).padStart(2, "0");

            timer.textContent = minutes + ":" + seconds;
        }


        function updateButtons() {
            sessionMinus.disabled = running;
            sessionPlus.disabled = running;
            breakMinus.disabled = running;
            breakPlus.disabled = running;
        }


        function updateSettings() {
            sessionValue.textContent = sessionTime + " min";
            breakValue.textContent = breakTime + " min";
        }


        sessionPlus.addEventListener("click", function () {
            sessionTime++;
            updateSettings();

            if (!running && isSession) {
                currentTime = sessionTime * 60;
                showTime();
            }
        });


        sessionMinus.addEventListener("click", function () {
            if (sessionTime > 0) {
                sessionTime--;
                updateSettings();

                if (!running && isSession) {
                    currentTime = sessionTime * 60;
                    showTime();
                }
            }
        });


        breakPlus.addEventListener("click", function () {
            breakTime++;
            updateSettings();

            if (!running && !isSession) {
                currentTime = breakTime * 60;
                showTime();
            }
        });


        breakMinus.addEventListener("click", function () {
            if (breakTime > 0) {
                breakTime--;
                updateSettings();

                if (!running && !isSession) {
                    currentTime = breakTime * 60;
                    showTime();
                }
            }
        });


        startBtn.addEventListener("click", function () {

            if (running) {
                return;
            }

            running = true;
            startBtn.textContent = "Pause";

            updateButtons();

            interval = setInterval(function () {

                if (currentTime > 0) {
                    currentTime--;
                    showTime();
                }

                else {

                    if (isSession) {
                        isSession = false;
                        title.textContent = "Break!";
                        currentTime = breakTime * 60;
                        timer.style.color = "#e86645";
                    }

                    else {
                        isSession = true;
                        title.textContent = "Session";
                        currentTime = sessionTime * 60;
                        timer.style.color = "#00a5b5";
                    }

                    showTime();
                }

            }, 1000);
        });


        resetBtn.addEventListener("click", function () {

            clearInterval(interval);

            running = false;
            isSession = true;

            sessionTime = 20;
            breakTime = 5;

            currentTime = sessionTime * 60;

            title.textContent = "Session";
            timer.style.color = "#00a5b5";
            startBtn.textContent = "Start";

            updateSettings();
            updateButtons();
            showTime();
        });


        showTime();
        updateSettings();
        updateButtons();
    </script>


</body>
</html>
