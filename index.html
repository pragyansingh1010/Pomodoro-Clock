<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Clock</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(90deg, #eaa267, #f0c283);
        }

        .container {
            width: 220px;
            height: 460px;
            background: rgba(55, 43, 34, 0.94);
            color: white;
            text-align: center;
        }

        /* Upper part */
        .timer-section {
            height: 190px;
            background: #eee;
            margin: 0 25px;
            border-right: 12px solid #00a5b5;
            border-bottom: 12px solid #00a5b5;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #timer {
            font-size: 32px;
            color: #00a5b5;
            font-family: monospace;
        }

        /* Bottom part */
        .control-section {
            padding: 22px 12px 0;
        }

        
    </style>
</head>

<body>

    <div class="container">

        <div class="timer-section">
            <div id="timer">20:00</div>
        </div>

        <div class="control-section">

            <div id="title">Session</div>

            <div class="settings">

                <div class="setting">
                    <div class="setting-title">session time</div>
                    <div class="value" id="sessionValue">20 min</div>

                    <div class="buttons">
                        <button class="small-btn" id="sessionMinus">-</button>
                        <button class="small-btn" id="sessionPlus">+</button>
                    </div>
                </div>

                <div class="setting">
                    <div class="setting-title">break time</div>
                    <div class="value" id="breakValue">5 min</div>

                    <div class="buttons">
                        <button class="small-btn" id="breakMinus">-</button>
                        <button class="small-btn" id="breakPlus">+</button>
                    </div>
                </div>

            </div>

            <div class="main-buttons">
                <button class="main-btn" id="startBtn">Start</button>
                <button class="main-btn" id="resetBtn">Reset</button>
            </div>

        </div>
    </div>



</body>
</html>
